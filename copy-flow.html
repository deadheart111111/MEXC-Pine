// ══════════════════════════════════════════════════════════════
// التوقيت — حدث NY / عرض أمستردام
// ══════════════════════════════════════════════════════════════
tzAMS = &quot;Europe/Amsterdam&quot;
tzNY  = &quot;America/New_York&quot;

h = hour(timenow, tzAMS)
m = minute(timenow, tzAMS)
s = second(timenow, tzAMS)
timeStr = str.tostring(h,&quot;00&quot;) + &quot;:&quot; + str.tostring(m,&quot;00&quot;) + &quot;:&quot; + str.tostring(s,&quot;00&quot;) + &quot; أمستردام&quot;

hNY = hour(timenow, tzNY)
mNY = minute(timenow, tzNY)

f_nextTs(th, tm) =&gt;
    y = year(timenow, tzNY)
    mo = month(timenow, tzNY)
    d = dayofmonth(timenow, tzNY)
    ts = timestamp(tzNY, y, mo, d, th, tm, 0)
    ts &lt;= timenow ? timestamp(tzNY, y, mo, d + 1, th, tm, 0) : ts

f_nextTsTZ(tz, th, tm) =&gt;
    y = year(timenow, tz)
    mo = month(timenow, tz)
    d = dayofmonth(timenow, tz)
    ts = timestamp(tz, y, mo, d, th, tm, 0)
    ts &lt;= timenow ? timestamp(tz, y, mo, d + 1, th, tm, 0) : ts

f_leftStr(ts) =&gt;
    left = math.max(0, math.floor((ts - timenow) / 1000))
    str.tostring(math.floor(left / 3600), &quot;00&quot;) + &quot;:&quot; + str.tostring(math.floor((left % 3600) / 60), &quot;00&quot;) + &quot;:&quot; + str.tostring(left % 60, &quot;00&quot;)

f_cBody(i) =&gt; math.max(math.abs(close[i] - open[i]), syminfo.mintick)
f_cRng(i) =&gt; math.max(high[i] - low[i], syminfo.mintick)
f_cWd(i) =&gt; math.min(close[i], open[i]) - low[i]
f_cWu(i) =&gt; high[i] - math.max(close[i], open[i])

tzLon = &quot;Europe/London&quot;
tzTok = &quot;Asia/Tokyo&quot;
hLon = hour(timenow, tzLon)
mLon = minute(timenow, tzLon)
hTok = hour(timenow, tzTok)
inAsiaNow = hTok &gt;= 9 and hTok &lt; 18
inLonNow  = (hLon &gt; 8 or (hLon == 8 and mLon &gt;= 0)) and (hLon &lt; 16 or (hLon == 16 and mLon &lt; 30))
inNyNow   = (hNY &gt; 9 or (hNY == 9 and mNY &gt;= 30)) and hNY &lt; 16
inOvNow   = inLonNow and inNyNow
tAsia = time(timeframe.period, &quot;0900-1800:1234567&quot;, tzTok)
tLon  = time(timeframe.period, &quot;0800-1630:1234567&quot;, tzLon)
tNy   = time(timeframe.period, &quot;0930-1600:1234567&quot;, tzNY)
var float pxAsia = na
var float pxLon = na
var float pxNy = na
if not na(tAsia) and na(tAsia[1])
    pxAsia := open
if not na(tLon) and na(tLon[1])
    pxLon := open
if not na(tNy) and na(tNy[1])
    pxNy := open
f_sessDir(px) =&gt; na(px) ? &quot;محايد&quot; : close &gt; px ? &quot;صعود&quot; : close &lt; px ? &quot;هبوط&quot; : &quot;محايد&quot;
f_sessCol(d) =&gt; d == &quot;صعود&quot; ? color.lime : d == &quot;هبوط&quot; ? color.red : color.gray
tsLonOpen = f_nextTsTZ(tzLon, 8, 0)
tsNyOpen  = f_nextTsTZ(tzNY, 9, 30)

tsLonEnd = f_nextTsTZ(tzLon, 16, 30)
tsNyEnd  = f_nextTsTZ(tzNY, 16, 0)
tsAsiaEnd = f_nextTsTZ(tzTok, 18, 0)
nearLon = not inLonNow and math.floor((tsLonOpen - timenow) / 60000) &lt;= 15
nearNy  = not inNyNow and math.floor((tsNyOpen - timenow) / 60000) &lt;= 15
sessName = &quot;سيولة ضعيفة&quot;
sessDir = &quot;—&quot;
sessLeftTs = tsAsiaOpen
sessCol = color.gray
if inOvNow
    sessName := &quot;تداخل لندن-نيويورك&quot;
    sessDir := f_sessDir(pxNy)
    sessLeftTs := tsLonEnd
    sessCol := f_sessCol(sessDir)
else if nearNy
    sessName := &quot;اقتراب نيويورك&quot;
    sessDir := &quot;—&quot;
    sessLeftTs := tsNyOpen
    sessCol := color.orange

    sessName := &quot;نيويورك&quot;
    sessDir := f_sessDir(pxNy)
    sessLeftTs := tsNyEnd
    sessCol := f_sessCol(sessDir)

    sessName := &quot;اقتراب لندن&quot;
    sessDir := &quot;—&quot;
    sessLeftTs := tsLonOpen
    sessCol := color.orange

    sessDir := f_sessDir(pxLon)
    sessLeftTs := tsLonEnd
    sessCol := f_sessCol(sessDir)

    sessName := &quot;آسيا&quot;
    sessDir := f_sessDir(pxAsia)
    sessLeftTs := tsAsiaEnd
    sessCol := f_sessCol(sessDir)

    sessName := &quot;سيولة ضعيفة&quot;
    sessDir := &quot;—&quot;
    sessLeftTs := tsAsiaOpen
    sessCol := color.gray

f_amsClock(ts) =&gt;
    sameDay = year(ts, tzAMS) == year(timenow, tzAMS) and month(ts, tzAMS) == month(timenow, tzAMS) and dayofmonth(ts, tzAMS) == dayofmonth(timenow, tzAMS)
    tmrTs = timestamp(tzAMS, year(timenow, tzAMS), month(timenow, tzAMS), dayofmonth(timenow, tzAMS) + 1, 12, 0, 0)
    isTmr = year(ts, tzAMS) == year(tmrTs, tzAMS) and month(ts, tzAMS) == month(tmrTs, tzAMS) and dayofmonth(ts, tzAMS) == dayofmonth(tmrTs, tzAMS)
    hhmm = str.tostring(hour(ts, tzAMS), &quot;00&quot;) + &quot;:&quot; + str.tostring(minute(ts, tzAMS), &quot;00&quot;)
    dw = dayofweek(ts, tzAMS)
    dwAr = dw == dayofweek.sunday ? &quot;الأحد&quot; : dw == dayofweek.monday ? &quot;الاثنين&quot; : dw == dayofweek.tuesday ? &quot;الثلاثاء&quot; : dw == dayofweek.wednesday ? &quot;الأربعاء&quot; : dw == dayofweek.thursday ? &quot;الخميس&quot; : dw == dayofweek.friday ? &quot;الجمعة&quot; : &quot;السبت&quot;
    prefix = sameDay ? &quot;&quot; : isTmr ? &quot;غداً &quot; : dwAr + &quot; &quot; + str.tostring(dayofmonth(ts, tzAMS), &quot;00&quot;) + &quot;/&quot; + str.tostring(month(ts, tzAMS), &quot;00&quot;) + &quot; &quot;
    prefix + hhmm

f_sameNY(ts) =&gt; year(timenow, tzNY) == year(ts, tzNY) and month(timenow, tzNY) == month(ts, tzNY) and dayofmonth(timenow, tzNY) == dayofmonth(ts, tzNY)
f_sameBar(ts) =&gt; year(time, tzNY) == year(ts, tzNY) and month(time, tzNY) == month(ts, tzNY) and dayofmonth(time, tzNY) == dayofmonth(ts, tzNY)

f_firstFri(y, mo) =&gt;
    t1 = timestamp(tzNY, y, mo, 1, 8, 30, 0)
    add = (dayofweek.friday - dayofweek(t1, tzNY) + 7) % 7
    timestamp(tzNY, y, mo, 1 + add, 8, 30, 0)

f_step(p) =&gt;
    p &gt;= 200 ? 1.0 : p &gt;= 50 ? 0.5 : 0.1

f_roundUp(p) =&gt;
    s = f_step(p)
    math.ceil((p + s * 0.02) / s) * s

f_roundDn(p) =&gt;
    s = f_step(p)
    math.floor((p - s * 0.02) / s) * s

f_tpLong(entry, sl, swing, band, vw, aligned, impulseOn, atr0) =&gt;
    risk = math.max(entry - sl, atr0 * 0.35)
    rMult = aligned and impulseOn ? 2.2 : aligned or impulseOn ? 1.7 : 1.4
    base = entry + risk * rMult
    minP = entry + math.max(risk * 1.25, atr0 * 0.8)
    maxP = entry + math.max(risk * 2.8, atr0 * 2.4)
    float best = math.min(math.max(base, minP), maxP)
    float bestD = 1.0e10
    if not na(swing) and swing &gt;= minP and swing &lt;= maxP
        d = math.abs(swing - base)
        if d &lt; bestD
            best := swing
            bestD := d
    if not na(band) and band &gt;= minP and band &lt;= maxP
        d = math.abs(band - base)
        if d &lt; bestD
            best := band
            bestD := d
    vwM = not na(vw) and vw &gt; entry ? vw : na
    if not na(vwM) and vwM &gt;= minP and vwM &lt;= maxP
        d = math.abs(vwM - base)
        if d &lt; bestD
            best := vwM
            bestD := d
    rd = f_roundUp(minP)
    if rd &gt;= minP and rd &lt;= maxP
        d = math.abs(rd - base)
        if d &lt; bestD
            best := rd
            bestD := d
    best

f_tpShort(entry, sl, swing, band, vw, aligned, impulseOn, atr0) =&gt;
    risk = math.max(sl - entry, atr0 * 0.35)
    rMult = aligned and impulseOn ? 2.2 : aligned or impulseOn ? 1.7 : 1.4
    base = entry - risk * rMult
    minP = entry - math.max(risk * 1.25, atr0 * 0.8)
    maxP = entry - math.max(risk * 2.8, atr0 * 2.4)
    float best = math.max(math.min(base, minP), maxP)
    float bestD = 1.0e10
    if not na(swing) and swing &lt;= minP and swing &gt;= maxP
        d = math.abs(swing - base)
        if d &lt; bestD
            best := swing
            bestD := d
    if not na(band) and band &lt;= minP and band &gt;= maxP
        d = math.abs(band - base)
        if d &lt; bestD
            best := band
            bestD := d
    vwM = not na(vw) and vw &lt; entry ? vw : na
    if not na(vwM) and vwM &lt;= minP and vwM &gt;= maxP
        d = math.abs(vwM - base)
        if d &lt; bestD
            best := vwM
            bestD := d
    rd = f_roundDn(minP)
    if rd &lt;= minP and rd &gt;= maxP
        d = math.abs(rd - base)
        if d &lt; bestD
            best := rd
            bestD := d
    best

// أقرب مغناطيس أمام الهدف الحالي فقط (لا أبعد هدف)
f_nearLong(cur, pad, maxP, px, a, b, c) =&gt;
    float best = na
    if not na(a) and a &gt; cur + pad and a &lt;= maxP and a &gt; px
        best := a
    if not na(b) and b &gt; cur + pad and b &lt;= maxP and b &gt; px
        best := na(best) ? b : math.min(best, b)
    if not na(c) and c &gt; cur + pad and c &lt;= maxP and c &gt; px
        best := na(best) ? c : math.min(best, c)
    best

f_nearShort(cur, pad, maxP, px, a, b, c) =&gt;
    float best = na
    if not na(a) and a &lt; cur - pad and a &gt;= maxP and a &lt; px
        best := a
    if not na(b) and b &lt; cur - pad and b &gt;= maxP and b &lt; px
        best := na(best) ? b : math.max(best, b)
    if not na(c) and c &lt; cur - pad and c &gt;= maxP and c &lt; px
        best := na(best) ? c : math.max(best, c)
    best

isMajorNewsBar = ((isNfpBar or isCpiBar or isPpiBar or isPceBar or isRetailBar or isGdpBar or isDurBar or isHouseBar or isPhillyBar or isTradeBar or isEmpBar or isProdBar or isImpBar) and w0830Bar) or (isFomcBar and (w1400Bar or w1430Bar)) or (isMinsBar and w1400Bar) or (isJh28Bar and w1000Bar) or ((isIsmBar or isIsmsBar or isJoltsBar or isMichBar or isConfBar or isNhsBar or isFactBar or isExistBar or isPendBar or isWholeBar) and w1000Bar) or (isDallasBar and w1030Bar) or (isIpBar and w0915Bar) or (isAdpBar and w0815Bar) or (isBeigeBar and w1400Bar) or ((isChiBar or isSpmBar or isFlashBar) and w0945Bar)

var int qBar = na

if newsStart or claimStart

if not na(qBar) and bar_index &gt; qBar and bar_index &lt; qBar + statN
    qHi := math.max(qHi, high)
    qLo := math.min(qLo, low)
if not na(qBar) and bar_index - qBar == statN
    qHi := math.max(qHi, high)
    qLo := math.min(qLo, low)
    span = math.max(qHi - qPx, qPx - qLo)
    moveAtr = qAtr &gt; 0 ? span / qAtr : 0.0
    ret = close - qPx
    withT = (ret &gt; 0 and qTrend &gt; 0) or (ret &lt; 0 and qTrend &lt; 0) ? 1 : 0
    if qClaim
        array.push(evAbsC, moveAtr)
        if array.size(evAbsC) &gt; 12
            array.shift(evAbsC)
    else
        array.push(evAbs, moveAtr)
        array.push(evWith, withT)

            array.shift(evWith)
    lastRet := close - qPx
    lastEndPx := close
    lastLo2 := qLo
    lastHi2 := qHi
    lastNm := qName
    qBar := na
nEv = array.size(evAbs)
nEvC = array.size(evAbsC)
avgAbs = nEv &gt; 0 ? array.avg(evAbs) : na
avgAbsC = nEvC &gt; 0 ? array.avg(evAbsC) : na
int nWith = 0
if nEv &gt; 0
    for i = 0 to nEv - 1
        nWith += array.get(evWith, i)
pctWith = nEv &gt; 0 ? 100.0 * nWith / nEv : na
useClaims = nearestTs == tsClaims
avgUse = useClaims ? (nEvC &gt;= 3 ? avgAbsC : nz(avgAbs, 1.2) * 0.45) : avgAbs
nShow = useClaims ? nEvC : nEv
statTxt = nShow &lt; 3 ? &quot;لا يكفي تاريخ سعري&quot; : str.tostring(close - (nShow &gt;= 3 ? avgUse : 1.2) * nz(atr, close * 0.01), &quot;#.##&quot;) + &quot; – &quot; + str.tostring(close + (nShow &gt;= 3 ? avgUse : 1.2) * nz(atr, close * 0.01), &quot;#.##&quot;) + (useClaims ? &quot;&quot; : pctWith &gt;= 60 ? (emaUp ? &quot; | غالباً صعود&quot; : &quot; | غالباً هبوط&quot;) : pctWith &lt;= 40 ? (emaUp ? &quot; | غالباً هبوط&quot; : &quot; | غالباً صعود&quot;) : &quot; | اتجاه مختلط&quot;)
statCol = nShow &lt; 3 ? color.gray : useClaims ? color.orange : pctWith &gt;= 60 ? color.lime : pctWith &lt;= 40 ? color.red : color.orange
expCol = usedBias == &quot;تيسير&quot; ? color.lime : usedBias == &quot;تشديد&quot; ? color.red : color.gray
atrAvg = ta.sma(atr, 20)
sq = atr &lt; atrAvg * 0.82 ? 1.35 : atr &gt; atrAvg * 1.25 ? 0.85 : 1.0
leftDn = pricedHawk ? 0.45 : 1.0
leftUp = pricedDove ? 0.45 : 1.0
band = (nShow &gt;= 3 ? avgUse : (useClaims ? 0.55 : 1.2)) * nz(atr, close * 0.01) * sq
float pxLo = close - band
float pxHi = close + band
biasTxt = &quot;محايد&quot;
if usedBias == &quot;تشديد&quot;
    pxLo := close - band * 1.30 * leftDn
    pxHi := close + band * (pricedHawk ? 0.90 : 0.50)
    biasTxt := &quot;هبوط&quot;
else if usedBias == &quot;تيسير&quot;
    pxLo := close - band * (pricedDove ? 0.90 : 0.50)
    pxHi := close + band * 1.30 * leftUp
    biasTxt := &quot;صعود&quot;
else
    pxLo := close - band * (pricedHawk ? 0.55 : 1.0)
    pxHi := close + band * (pricedDove ? 0.55 : 1.0)
pxTxt = str.tostring(pxLo, &quot;#.##&quot;) + &quot; – &quot; + str.tostring(pxHi, &quot;#.##&quot;)
pxCol = biasTxt == &quot;صعود&quot; ? color.lime : biasTxt == &quot;هبوط&quot; ? color.red : color.orange
newsDirTxt = biasTxt
newsDirCol = pxCol
newsPricedTxt = pricedTag
liveOn = not na(qBar)
resRet = liveOn ? close - qPx : lastRet
resNow = liveOn ? close : lastEndPx
resLo = liveOn ? qLo : lastLo2
resHi = liveOn ? qHi : lastHi2
resNm = liveOn ? qName : lastNm
resPx0 = liveOn ? qPx : (na(lastEndPx) or na(lastRet) ? na : lastEndPx - lastRet)
resThr = nz(atr, close * 0.01) * 0.25
resPct = not na(resRet) and not na(resPx0) and resPx0 != 0 ? resRet / resPx0 * 100.0 : na
resPre = liveOn ? &quot;الآن &quot; : &quot;آخر &quot;
newsResTxt = na(resRet) ? &quot;انتظار الخبر&quot; : resRet &gt; resThr ? resPre + resNm + &quot; | صعد &quot; + str.tostring(resNow, &quot;#.##&quot;) + &quot; (+&quot; + str.tostring(resPct, &quot;#.#&quot;) + &quot;)&quot; : resRet &lt; -resThr ? resPre + resNm + &quot; | نزل &quot; + str.tostring(resNow, &quot;#.##&quot;) + &quot; (&quot; + str.tostring(resPct, &quot;#.#&quot;) + &quot;)&quot; : resPre + resNm + &quot; | تذبذب &quot; + str.tostring(resLo, &quot;#.##&quot;) + &quot;-&quot; + str.tostring(resHi, &quot;#.##&quot;)
newsResCol = na(resRet) ? color.gray : resRet &gt; resThr ? color.lime : resRet &lt; -resThr ? color.red : color.orange

var int lastFireTs = na

newsPanel = newsPre or newsPost or isHighImpact

// ══════════════════════════════════════════════════════════════
// التوصية

scoreB = 0
scoreS = 0
if emaUp
    scoreB += 2
if emaDn
    scoreS += 2
if aboveFast
    scoreB += 1
if not aboveFast
    scoreS += 1
if rsi &gt; 55 and rsi &lt; 75
    scoreB += 2
else if rsiContUp
    scoreB += 2
if rsi &lt; 45 and rsi &gt; 25
    scoreS += 2
else if rsiContDn
    scoreS += 2
if flowLong
    scoreB += 2
if flowShort
    scoreS += 2
if close &gt; bbMid
    scoreB += 1
if close &lt; bbMid

raw = &quot;انتظار&quot;

else if scoreS &gt;= 5 and scoreS &gt; scoreB + 1

holdNeed = isFastTF ? 3 : 1
flipNeed = isFastTF ? 4 : 2

weakShort = isFastTF ? (emaUp and aboveSlow) : (aboveFast or emaUp)
mxLive = mxEntry &gt; 0 and mxCont &gt; 0

mxLiveShort = mxLive and mxSide == &quot;بيع&quot;

biasLong = htfUp
ctrTrend = (raw == &quot;شراء&quot; and not biasLong) or (raw == &quot;بيع&quot; and biasLong)
blowCtr = (raw == &quot;شراء&quot; and scoreB &gt;= scoreS + 4 and flowLong and aboveFast) or (raw == &quot;بيع&quot; and scoreS &gt;= scoreB + 4 and flowShort and not aboveFast)
blockedCtr = false

var bool lockedBE = false

var int waitBars = 0
var int sideBars = 0

oppSell = rec == &quot;شراء&quot; and raw == &quot;بيع&quot;  and scoreS &gt;= scoreB + flipNeed and closedOk and not isFastTF
sameAsLast = raw == lastSide
oppAsLast = (raw == &quot;شراء&quot; and lastSide == &quot;بيع&quot;) or (raw == &quot;بيع&quot; and lastSide == &quot;شراء&quot;)
htfOk = (raw == &quot;شراء&quot; and biasLong) or (raw == &quot;بيع&quot; and not biasLong)

if mxLiveLong and raw == &quot;بيع&quot;

    else if rec != &quot;شراء&quot;
        rec := &quot;شراء&quot;

else if mxLiveShort and raw == &quot;شراء&quot;

newSell = rec == &quot;بيع&quot;  and rec[1] != &quot;بيع&quot;

// ══════════════════════════════════════════════════════════════
// المراكز + حجز الربح + تمديد مشروط

swingLo = ta.lowest(low[1], 12)
swingHi = ta.highest(high[1], 12)
longSL  = math.min(swingLo, emaFast) - atr * 0.3
shortSL = math.max(swingHi, emaFast) + atr * 0.3

var float entryP  = na
var float origSL  = na
var float liveSL  = na
var float liveTP  = na

var string tDir   = na

alignedLong  = htfUp and aboveVwap
alignedShort = not htfUp and not aboveVwap

if newBuy
    entryP   := close
    origSL   := longSL
    liveSL   := longSL
    tDir     := &quot;BUY&quot;
    lockedBE := false
    swingM   = na(lastPH) ? swingHi : math.max(lastPH, swingHi)

else if newSell

    origSL   := shortSL

    tDir     := &quot;SELL&quot;
    lockedBE := false
    swingM   = na(lastPL) ? swingLo : math.min(lastPL, swingLo)
    planTP   := f_tpShort(close, shortSL, swingM, bbLower, vwapVal, alignedShort, flowShort, atr)
    liveTP   := planTP
else if not hasTrade
    entryP   := na
    origSL   := na
    liveSL   := na
    liveTP   := na
    planTP   := na
    tDir     := na
    lockedBE := false

// إن ضاعت المراكز أثناء توصية نشطة — أعد بناءها
if hasTrade and (na(entryP) or na(liveSL) or na(liveTP))
    entryP := nz(entryP, close)
    if rec == &quot;شراء&quot;
        tDir   := &quot;BUY&quot;
        origSL := nz(origSL, longSL)
        liveSL := nz(liveSL, origSL)
        swingM = na(lastPH) ? swingHi : math.max(lastPH, swingHi)
        planTP := nz(planTP, f_tpLong(entryP, liveSL, swingM, bbUpper, vwapVal, alignedLong, flowLong, nz(atr, close * 0.01)))
        liveTP := nz(liveTP, planTP)
    else
        tDir   := &quot;SELL&quot;
        origSL := nz(origSL, shortSL)
        liveSL := nz(liveSL, origSL)
        swingM = na(lastPL) ? swingLo : math.min(lastPL, swingLo)
        planTP := nz(planTP, f_tpShort(entryP, liveSL, swingM, bbLower, vwapVal, alignedShort, flowShort, nz(atr, close * 0.01)))

bool tpHit = false
bool slHit = false
bool lockHalf = false

if tDir == &quot;BUY&quot; and hasTrade and not newBuy
    risk0 = math.max(entryP - origSL, atr * 0.35)
    span = liveTP - entryP
    progress = span &gt; 0 ? (close - entryP) / span : 0.0
    profitR = (close - entryP) / risk0
    caution = rsi &gt; 75 and weakVol and not bullImpulse

    // 1) قفل الدخول بعد 55% من الطريق أو +1R
    if progress &gt;= 0.55 or profitR &gt;= 1.0
        lockedBE := true
        liveSL := math.max(liveSL, entryP + atr * 0.10)

    // 2) قرب الهدف: احجز نصف المشوار المخطط
    if progress &gt;= 0.80
        lockHalf := true
        liveSL := math.max(liveSL, entryP + (planTP - entryP) * 0.50)

    // 3) ضعف التدفق وأنت رابح: اقفز للـ EMA 5 حتى لا يعود الربح
    if weakLong and close &gt; entryP
        snap = math.max(entryP + atr * 0.10, emaFast - atr * 0.20)
        liveSL := math.max(liveSL, snap)

    // 4) بعد قفل الدخول: تتبّع EMA 5 (خط الدفاع في الكود) ولا يُرخى
    if lockedBE
        trail = emaFast - atr * 0.30
        if trail &gt; liveSL
            liveSL := trail

    // 5) تمديد الهدف: دفعة جديدة + تدفق + إطار أعلى + منتصف الطريق

    fresh = bullImpulse or not na(ph)

        pad = atr * 0.25
        rd = f_roundUp(math.max(close, liveTP))
        nxt = f_nearLong(liveTP, pad, maxP, close, bbUpper, rd, lastPH)
        if not na(nxt)
            liveTP := nxt

    if low &lt;= liveSL
        slHit := true
    else if high &gt;= liveTP
        tpHit := true

else if tDir == &quot;SELL&quot; and hasTrade and not newSell
    risk0 = math.max(origSL - entryP, atr * 0.35)
    span = entryP - liveTP
    progress = span &gt; 0 ? (entryP - close) / span : 0.0
    profitR = (entryP - close) / risk0
    caution = rsi &lt; 25 and weakVol and not bearImpulse

    if progress &gt;= 0.55 or profitR &gt;= 1.0
        lockedBE := true
        liveSL := math.min(liveSL, entryP - atr * 0.10)

    if progress &gt;= 0.80
        lockHalf := true
        liveSL := math.min(liveSL, entryP - (entryP - planTP) * 0.50)

    if weakShort and close &lt; entryP
        snap = math.min(entryP - atr * 0.10, emaFast + atr * 0.20)
        liveSL := math.min(liveSL, snap)

    if lockedBE
        trail = emaFast + atr * 0.30
        if trail &lt; liveSL
            liveSL := trail

    fresh = bearImpulse or not na(pl)
    flowOn = emaDn and not aboveFast and (flowShort or rsiContDn) and not caution
    if flowOn and not htfUp and fresh and progress &gt;= 0.55
        maxP = entryP - math.max(risk0 * 2.8, atr * 2.4)
        pad = atr * 0.25
        rd = f_roundDn(math.min(close, liveTP))
        nxt = f_nearShort(liveTP, pad, maxP, close, bbLower, rd, lastPL)
        if not na(nxt)
            liveTP := nxt

    if high &gt;= liveSL
        slHit := true
    else if low &lt;= liveTP
        tpHit := true

// إغلاق الصفقة عند الهدف أو الوقف المحمي
if tpHit or slHit
    rec := &quot;انتظار&quot;
    hold := 0
    hasTrade := false

recCol = rec == &quot;شراء&quot; ? color.lime : rec == &quot;بيع&quot; ? color.red : color.gray

advice = &quot;—&quot;
adviceCol = color.gray
if tpHit
    advice := &quot;هدف تحقق | أُغلق&quot;
    adviceCol := color.lime
else if slHit
    advice := lockedBE ? &quot;حُجز الربح | أُغلق&quot; : &quot;وقف خسارة&quot;
    adviceCol := lockedBE ? color.lime : color.red
else if hasTrade
    if rec == &quot;شراء&quot;
        if lockHalf
            advice := &quot;اقفل جزء | الهدف قريب&quot;
            adviceCol := color.yellow
        else if lockedBE and emaUp and aboveFast
            advice := &quot;استمر | الوقف محمي&quot;
            adviceCol := color.lime
        else if emaUp and aboveFast and not (rsi &gt; 75 and weakVol and not bullImpulse)
            advice := &quot;استمر | التدفق يدعم&quot;
            adviceCol := color.lime
        else if rsi &gt; 75 and weakVol and not bullImpulse
            advice := &quot;احذر | تشبع + حجم ضعيف&quot;
            adviceCol := color.orange
        else if not aboveFast or emaDn
            advice := &quot;راقب الخروج | ضعف&quot;
            adviceCol := color.orange
        else
            advice := &quot;استمر بحذر&quot;
            adviceCol := color.yellow
    else if rec == &quot;بيع&quot;
        if lockHalf
            advice := &quot;اقفل جزء | الهدف قريب&quot;
            adviceCol := color.yellow
        else if lockedBE and emaDn and not aboveFast
            advice := &quot;استمر | الوقف محمي&quot;
            adviceCol := color.red
        else if emaDn and not aboveFast and not (rsi &lt; 25 and weakVol and not bearImpulse)
            advice := &quot;استمر | التدفق يدعم&quot;
            adviceCol := color.red
        else if rsi &lt; 25 and weakVol and not bearImpulse
            advice := &quot;احذر | تشبع بيع + حجم ضعيف&quot;
            adviceCol := color.orange
        else if aboveFast or emaUp
            advice := &quot;راقب الخروج | ضعف&quot;
            adviceCol := color.orange
        else
            advice := &quot;استمر بحذر&quot;
            adviceCol := color.yellow

mxPosLong = mxEntry &gt; 0 and mxCont &gt; 0 and mxSide == &quot;شراء&quot;
mxPosShort = mxEntry &gt; 0 and mxCont &gt; 0 and mxSide == &quot;بيع&quot;
if not tpHit and not slHit
    if blockedFlip and rec != &quot;انتظار&quot;
        advice := mxLive ? (mxLiveLong ? &quot;لا تعكس صفقة الشراء | 5د ضوضاء&quot; : &quot;لا تعكس صفقة البيع | 5د ضوضاء&quot;) : (htfUp ? &quot;5د ضوضاء بيع | الاتجاه الأكبر صعود — لا تعكس&quot; : &quot;5د ضوضاء شراء | الاتجاه الأكبر هبوط — لا تعكس&quot;)
        adviceCol := color.orange
    else if blockedFlip and rec == &quot;انتظار&quot;
        advice := mxLive ? &quot;اخرج فقط | ممنوع فتح العكس&quot; : &quot;انتظار التأكيد | ممنوع العكس السريع على 5د&quot;
        adviceCol := color.orange
    else if mxPosLong and rec == &quot;بيع&quot;
        advice := pinHi or bounceEmaS ? &quot;لونج ضد الاتجاه | نجم/رفض EMA — لا تضيف، جني الارتداد&quot; : pinLo or sweepLo ? &quot;مطرقة تدعم لونجك | جني عند الرفض — لا زيادة&quot; : &quot;لونج ضد 1H | الارتداد للخروج لا للزيادة&quot;
        adviceCol := color.orange
    else if mxPosShort and rec == &quot;شراء&quot;
        advice := pinLo or bounceEmaL ? &quot;شورت ضد الاتجاه | مطرقة/رفض دعم — لا تضيف، جني التصحيح&quot; : pinHi or sweepHi ? &quot;نجم يدعم شورك | جني عند الرفض — لا زيادة&quot; : &quot;شورت ضد 1H | التصحيح للخروج لا للزيادة&quot;
        adviceCol := color.orange
    else if rec == &quot;انتظار&quot; and advice == &quot;—&quot;
        if sweepLo
            advice := &quot;مطرقة صيد قاع | انتظر تأكيد فوق الذيل ثم تدفق&quot;
            adviceCol := color.orange
        else if sweepHi
            advice := &quot;نجم صيد قمة | انتظر تأكيد تحت الذيل ثم تدفق&quot;
            adviceCol := color.orange
        else if pinLo and emaDn
            advice := &quot;مطرقة ضد الهبوط | ارتداد قصير تحت EMA — مو عكس&quot;
            adviceCol := color.orange
        else if pinHi and emaUp
            advice := &quot;نجم ضد الصعود | تصحيح قصير فوق EMA — مو عكس&quot;
            adviceCol := color.orange
        else if pinLo
            advice := &quot;مطرقة | مشترين — لا تدخل حتى يتوافق التدفق&quot;
            adviceCol := color.yellow
        else if pinHi
            advice := &quot;نجم هابط | بائعين — لا تدخل حتى يتوافق التدفق&quot;
            adviceCol := color.yellow

bool lockWasOn = lockedBE

if (tpHit or slHit) or not hasTrade
    if not hasTrade
        entryP   := na
        origSL   := na
        liveSL   := na
        liveTP   := na
        planTP   := na
        tDir     := na
        lockedBE := false

// ══════════════════════════════════════════════════════════════
// الرسم
// ══════════════════════════════════════════════════════════════
plot(emaFast, &quot;EMA 5&quot;, color=color.blue, linewidth=2)
plot(emaSlow, &quot;EMA 13&quot;, color=color.orange, linewidth=1)
plot(bbUpper, &quot;BB Upper&quot;, color=color.new(color.gray, 70))
plot(bbLower, &quot;BB Lower&quot;, color=color.new(color.gray, 70))
plot(showVwap ? vwapVal : na, &quot;VWAP&quot;, color=color.new(#AB47BC, 45), linewidth=1)

var line lE = na
var line lS = na
var line lT = na
if barstate.islast
    if not na(lE)
        line.delete(lE)
        lE := na
    if not na(lS)
        line.delete(lS)
        lS := na
    if not na(lT)
        line.delete(lT)
        lT := na
    showNow = showLevels and hasTrade and rec != &quot;انتظار&quot; and not na(entryP) and not na(liveSL) and not na(liveTP)
    if showNow
        lE := line.new(bar_index - 6, entryP, bar_index + 4, entryP, color=color.new(#00ACC1, 0), width=2)
        lS := line.new(bar_index - 6, liveSL, bar_index + 4, liveSL, color=color.new(#EF5350, 0), width=2, style=line.style_dashed)
        lT := line.new(bar_index - 6, liveTP, bar_index + 4, liveTP, color=color.new(#66BB6A, 0), width=2, style=line.style_dashed)

bgcolor(isHighImpactBar ? color.new(color.orange, 90) : approachingBar ? color.new(color.yellow, 93) : na)

// ══════════════════════════════════════════════════════════════
// صفقة MEXC — Cont ثابت (1 Cont = 0.1 SOL). الربح يتبع السعر الحي
mxQtyUse = mxCont * mxContSz
mxOpen = mxEntry &gt; 0 and mxCont &gt; 0 and mxMargin &gt; 0 and mxLev &gt;= 1
mxLong = mxSide == &quot;شراء&quot;
mxMark = math.round(close * 100.0) / 100.0
mxPnl = mxOpen ? (mxLong ? (mxMark - mxEntry) : (mxEntry - mxMark)) * mxQtyUse : 0.0
mxMmr = mxMMR / 100.0
mxNotional = mxQtyUse * mxEntry
mxQtyBad = mxOpen and mxNotional &gt; 0 and mxMargin &gt; mxNotional
mxIMR = mxOpen and mxNotional &gt; 0 ? math.min(mxMargin / mxNotional, 0.90) : 1.0 / mxLev
mxLiq = mxOpen and not mxQtyBad ? (mxLong ? mxEntry * (1.0 - mxIMR + mxMmr) : mxEntry * (1.0 + mxIMR - mxMmr)) : na
mxSideTxt = mxOpen ? ((mxLong ? &quot;لونج &quot; : &quot;شورت &quot;) + str.tostring(mxLev, &quot;#&quot;) + &quot;x · &quot; + str.tostring(mxCont) + &quot; Cont&quot;) : &quot;لا صفقة&quot;
mxPnlTxt = (mxPnl &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + str.tostring(mxPnl, &quot;#.##&quot;)
mxLiqTxt = mxOpen and not na(mxLiq) ? str.tostring(mxLiq, &quot;#.##&quot;) : &quot;—&quot;
mxInitMar = mxOpen ? mxNotional / mxLev : 0.0
mxRoi = mxInitMar &gt; 0 ? mxPnl / mxInitMar * 100.0 : 0.0
mxPnlCol = not mxOpen ? color.gray : mxQtyBad ? color.orange : mxPnl &gt; 0 ? color.lime : mxPnl &lt; 0 ? color.red : color.gray
mxSideCol = not mxOpen ? color.gray : mxQtyBad ? color.orange : mxLong ? color.lime : color.red
mxPnlLiqTxt = not mxOpen ? &quot;—&quot; : mxQtyBad ? &quot;الكمية Cont غلط — اكتب Size(Cont) بدون فاصلة مثل 5753&quot; : mxPnlTxt + &quot; @&quot; + str.tostring(mxMark, &quot;#.##&quot;) + &quot; | تصفية &quot; + mxLiqTxt
newsNearTxt = nearestCD + &quot; | &quot; + newsStatus
newsDirRngTxt = newsDirTxt + &quot;  &quot; + pxTxt
newsMixTxt = newsPricedTxt + &quot; | &quot; + statTxt
htfCvdTxt = htfText + &quot; | &quot; + cvdText
sz = size.small

enterTxt = &quot;لا تدخل&quot;
enterCol = color.gray
if mxLive
    if (mxLiveLong and rec == &quot;بيع&quot;) or (mxLiveShort and rec == &quot;شراء&quot;) or (blockedFlip and rec == &quot;انتظار&quot;)
        enterTxt := &quot;اخرج فقط — لا تعكس&quot;
        enterCol := color.orange
    else
        enterTxt := &quot;صفقتك قائمة — لا تضيف&quot;
        enterCol := mxLiveLong ? color.lime : color.red
else if rec == &quot;شراء&quot;
    stretchedL = rsi &gt; 72 or (close &gt; bbUpper and not flowLong)
    readyL = emaUp and aboveFast and htfUp and not stretchedL
    if blockedFlip
        enterTxt := &quot;لا تدخل — انتظر تأكيد&quot;
        enterCol := color.orange
    else if readyL
        enterTxt := &quot;ادخل شراء الآن&quot;
        enterCol := color.lime
    else if stretchedL
        enterTxt := &quot;شراء — انتظر رجوع لـ EMA ثم ادخل&quot;
        enterCol := color.yellow
    else
        enterTxt := &quot;شراء — ادخل عند الثبات فوق EMA&quot;
        enterCol := color.yellow
else if rec == &quot;بيع&quot;
    stretchedS = rsi &lt; 28 or (close &lt; bbLower and not flowShort)
    readyS = emaDn and not aboveFast and not htfUp and not stretchedS
    if blockedFlip
        enterTxt := &quot;لا تدخل — انتظر تأكيد&quot;
        enterCol := color.orange
    else if readyS
        enterTxt := &quot;ادخل بيع الآن&quot;
        enterCol := color.red
    else if stretchedS
        enterTxt := &quot;بيع — انتظر رجوع لـ EMA ثم ادخل&quot;
        enterCol := color.yellow
    else
        enterTxt := &quot;بيع — ادخل عند الثبات تحت EMA&quot;
        enterCol := color.yellow
else if blockedFlip
    enterTxt := &quot;لا تدخل — الاتجاه يمنع العكس&quot;
    enterCol := color.orange
recShow = rec + &quot; → &quot; + enterTxt

var table t = table.new(position.top_right, 2, 21, border_width=1)

if showTable and barstate.islast
    table.clear(t, 0, 0, 1, 20)
    table.cell(t, 0, 0, &quot;MEXC Flow v7.26&quot;, bgcolor=color.blue, text_color=color.white, text_size=sz)
    table.cell(t, 1, 0, &quot;SOL&quot;, bgcolor=color.blue, text_color=color.yellow, text_size=sz)
    table.cell(t, 0, 1, &quot;الدخول&quot;, bgcolor=color.new(enterCol, 20), text_size=sz)
    table.cell(t, 1, 1, recShow, bgcolor=color.new(enterCol, 20), text_color=color.white, text_size=sz)
    table.cell(t, 0, 2, &quot;نصيحة&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 2, advice, text_color=adviceCol, text_size=sz)
    table.cell(t, 0, 3, &quot;صفقة MEXC&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 3, mxSideTxt, text_color=mxSideCol, text_size=sz)
    table.cell(t, 0, 4, &quot;الربح&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 4, mxPnlLiqTxt, text_color=mxPnlCol, text_size=sz)
    table.cell(t, 0, 5, &quot;الحجم&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 5, rvolText, text_color=rvolCol, text_size=sz)
    table.cell(t, 0, 6, &quot;تدفق كبير&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 6, whaleTxt, text_color=whaleCol, text_size=sz)
    table.cell(t, 0, 7, &quot;EMA 5&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 7, emaFastText, text_color=emaFastCol, text_size=sz)
    table.cell(t, 0, 8, &quot;RSI&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 8, str.tostring(rsi, &quot;#.#&quot;) + &quot; | &quot; + rsiText, text_color=rsiCol, text_size=sz)
    table.cell(t, 0, 9, &quot;اتجاه EMA&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 9, emaTrend + &quot; | &quot; + emaSlowText, text_color=emaCol, text_size=sz)
    table.cell(t, 0, 10, &quot;بولنجر / VWAP&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 10, bbPos + &quot; | &quot; + vwapText, text_color=bbCol, text_size=sz)
    table.cell(t, 0, 11, &quot;إطار / تدفق&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 11, htfName + &quot; &quot; + htfCvdTxt, text_color=htfCol, text_size=sz)
    table.cell(t, 0, 12, &quot;منطقة&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 12, zoneTxt, text_color=zoneCol, text_size=sz)
    table.cell(t, 0, 13, &quot;شمعات&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 13, candleTxt, text_color=candleCol, text_size=sz)
    table.cell(t, 0, 14, &quot;ذيول&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 14, wickTxt, text_color=wickCol, text_size=sz)
    table.cell(t, 0, 15, &quot;الوقت&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 15, timeStr, text_size=sz)
    table.cell(t, 0, 16, &quot;الجلسة&quot;, bgcolor=color.gray, text_size=sz)
    table.cell(t, 1, 16, sessTxt, text_color=sessCol, text_size=sz)
    table.cell(t, 0, 17, &quot;أقرب خبر&quot;, bgcolor=color.new(#37474F, 0), text_color=color.white, text_size=sz)
    table.cell(t, 1, 17, newsNearTxt, bgcolor=color.new(#37474F, 0), text_color=newsCol, text_size=sz)
    if newsPanel
        table.cell(t, 0, 18, &quot;اتجاه الخبر&quot;, bgcolor=color.gray, text_size=sz)
        table.cell(t, 1, 18, newsDirRngTxt, text_color=newsDirCol, text_size=sz)
        table.cell(t, 0, 19, &quot;نتيجة الخبر&quot;, bgcolor=color.gray, text_size=sz)
        table.cell(t, 1, 19, newsResTxt, text_color=newsResCol, text_size=sz)
        table.cell(t, 0, 20, &quot;تسعير SOL&quot;, bgcolor=color.gray, text_size=sz)
        table.cell(t, 1, 20, newsMixTxt, text_color=statCol, text_size=sz)

alertcondition(newBuy,  &quot;شراء&quot;, &quot;شراء – MEXC Flow&quot;)
alertcondition(newSell, &quot;بيع&quot;,  &quot;بيع – MEXC Flow&quot;)
alertcondition(tpHit, &quot;هدف&quot;, &quot;هدف تحقق – MEXC Flow&quot;)
alertcondition(slHit and lockWasOn, &quot;حجز&quot;, &quot;حُجز الربح – MEXC Flow&quot;)
alertcondition(isHighImpact and not isHighImpact[1], &quot;خبر&quot;, &quot;نافذة أخبار&quot;)
alertcondition(approaching and not approaching[1], &quot;اقتراب&quot;, &quot;خبر خلال 12 د&quot;)
</textarea>
<script>
function copyMe(){
  const t=document.getElementById('c');
  t.focus();
  t.setSelectionRange(0, t.value.length);
  const btn=document.getElementById('btn');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.value).then(()=>{
      btn.textContent='تم النسخ ✓';
      btn.className='ok';
    }).catch(()=>{
      btn.textContent='محدد — اضغط نسخ من القائمة';
    });
  } else {
    btn.textContent='محدد — اضغط نسخ من القائمة';
  }
}
</script>
