// ══════════════════════════════════════════════════════════════
// التوقيت — حدث NY / عرض أمستردام
// ══════════════════════════════════════════════════════════════
tzAMS = &quot;Europe/Amsterdam&quot;
tzNY  = &quot;America/New_York&quot;

h = hour(timenow, tzAMS)
m = minute(timenow, tzAMS)
s = second(timenow, tzAMS)
timeStr = str.tostring(h,&quot;00&quot;) + &quot;:&quot; + str.tostring(m,&quot;00&quot;) + &quot;:&quot; + str.tostring(s,&quot;00&quot;) + &quot; أمستردام&quot;

hNY = hour(timenow, tzNY)
mNY = minute(timenow, tzNY)

f_nextTs(th, tm) =&gt;
    y = year(timenow, tzNY)
    mo = month(timenow, tzNY)
    d = dayofmonth(timenow, tzNY)
    ts = timestamp(tzNY, y, mo, d, th, tm, 0)
    ts &lt;= timenow ? timestamp(tzNY, y, mo, d + 1, th, tm, 0) : ts

f_nextTsTZ(tz, th, tm) =&gt;
    y = year(timenow, tz)
    mo = month(timenow, tz)
    d = dayofmonth(timenow, tz)
    ts = timestamp(tz, y, mo, d, th, tm, 0)
    ts &lt;= timenow ? timestamp(tz, y, mo, d + 1, th, tm, 0) : ts

f_leftStr(ts) =&gt;
    left = math.max(0, math.floor((ts - timenow) / 1000))
    str.tostring(math.floor(left / 3600), &quot;00&quot;) + &quot;:&quot; + str.tostring(math.floor((left % 3600) / 60), &quot;00&quot;) + &quot;:&quot; + str.tostring(left % 60, &quot;00&quot;)

f_cBody(i) =&gt; math.max(math.abs(close[i] - open[i]), syminfo.mintick)
f_cRng(i) =&gt; math.max(high[i] - low[i], syminfo.mintick)
f_cWd(i) =&gt; math.min(close[i], open[i]) - low[i]
f_cWu(i) =&gt; high[i] - math.max(close[i], open[i])

tzLon = &quot;Europe/London&quot;
tzTok = &quot;Asia/Tokyo&quot;
hLon = hour(timenow, tzLon)
mLon = minute(timenow, tzLon)
hTok = hour(timenow, tzTok)
inAsiaNow = hTok &gt;= 9 and hTok &lt; 18
inLonNow  = (hLon &gt; 8 or (hLon == 8 and mLon &gt;= 0)) and (hLon &lt; 16 or (hLon == 16 and mLon &lt; 30))
inNyNow   = (hNY &gt; 9 or (hNY == 9 and mNY &gt;= 30)) and hNY &lt; 16
inOvNow   = inLonNow and inNyNow
tAsia = time(timeframe.period, &quot;0900-1800:1234567&quot;, tzTok)
tLon  = time(timeframe.period, &quot;0800-1630:1234567&quot;, tzLon)
tNy   = time(timeframe.period, &quot;0930-1600:1234567&quot;, tzNY)
var float pxAsia = na
var float pxLon = na
var float pxNy = na
if not na(tAsia) and na(tAsia[1])
    pxAsia := open
if not na(tLon) and na(tLon[1])
    pxLon := open
if not na(tNy) and na(tNy[1])
    pxNy := open
f_sessDir(px) =&gt; na(px) ? &quot;محايد&quot; : close &gt; px ? &quot;صعود&quot; : close &lt; px ? &quot;هبوط&quot; : &quot;محايد&quot;
f_sessCol(d) =&gt; d == &quot;صعود&quot; ? color.lime : d == &quot;هبوط&quot; ? color.red : color.gray
tsLonOpen = f_nextTsTZ(tzLon, 8, 0)

tsLonEnd = f_nextTsTZ(tzLon, 16, 30)
tsNyEnd  = f_nextTsTZ(tzNY, 16, 0)
tsAsiaEnd = f_nextTsTZ(tzTok, 18, 0)
nearLon = not inLonNow and math.floor((tsLonOpen - timenow) / 60000) &lt;= 15
nearNy  = not inNyNow and math.floor((tsNyOpen - timenow) / 60000) &lt;= 15
sessName = &quot;سيولة ضعيفة&quot;
sessDir = &quot;—&quot;
sessLeftTs = tsAsiaOpen
sessCol = color.gray
if inOvNow
    sessName := &quot;تداخل لندن-نيويورك&quot;
    sessDir := f_sessDir(pxNy)
    sessLeftTs := tsLonEnd
    sessCol := f_sessCol(sessDir)

    sessName := &quot;اقتراب نيويورك&quot;
    sessDir := &quot;—&quot;
    sessLeftTs := tsNyOpen
    sessCol := color.orange

    sessName := &quot;نيويورك&quot;
    sessDir := f_sessDir(pxNy)
    sessLeftTs := tsNyEnd
    sessCol := f_sessCol(sessDir)

    sessCol := f_sessCol(sessDir)

    sessLeftTs := tsAsiaOpen
    sessCol := color.gray

f_amsClock(ts) =&gt;
    sameDay = year(ts, tzAMS) == year(timenow, tzAMS) and month(ts, tzAMS) == month(timenow, tzAMS) and dayofmonth(ts, tzAMS) == dayofmonth(timenow, tzAMS)
    tmrTs = timestamp(tzAMS, year(timenow, tzAMS), month(timenow, tzAMS), dayofmonth(timenow, tzAMS) + 1, 12, 0, 0)
    isTmr = year(ts, tzAMS) == year(tmrTs, tzAMS) and month(ts, tzAMS) == month(tmrTs, tzAMS) and dayofmonth(ts, tzAMS) == dayofmonth(tmrTs, tzAMS)
    hhmm = str.tostring(hour(ts, tzAMS), &quot;00&quot;) + &quot;:&quot; + str.tostring(minute(ts, tzAMS), &quot;00&quot;)
    dw = dayofweek(ts, tzAMS)
    dwAr = dw == dayofweek.sunday ? &quot;الأحد&quot; : dw == dayofweek.monday ? &quot;الاثنين&quot; : dw == dayofweek.tuesday ? &quot;الثلاثاء&quot; : dw == dayofweek.wednesday ? &quot;الأربعاء&quot; : dw == dayofweek.thursday ? &quot;الخميس&quot; : dw == dayofweek.friday ? &quot;الجمعة&quot; : &quot;السبت&quot;
    prefix = sameDay ? &quot;&quot; : isTmr ? &quot;غداً &quot; : dwAr + &quot; &quot; + str.tostring(dayofmonth(ts, tzAMS), &quot;00&quot;) + &quot;/&quot; + str.tostring(month(ts, tzAMS), &quot;00&quot;) + &quot; &quot;
    prefix + hhmm

    add = (dayofweek.friday - dayofweek(t1, tzNY) + 7) % 7
    timestamp(tzNY, y, mo, 1 + add, 8, 30, 0)

// ══════════════════════════════════════════════════════════════
// التوصية: دخول من المنطقة الذهبية فقط — لا مطاردة القمة

pullBuy  = isLongFib and legOk and (inGold or inShallow)
pullSell = isShortFib and legOk and (inGold or inShallow)
contBuy  = isLongFib and legOk and atEnd and bullPat and strongVol and aboveAv and not extended
contSell = isShortFib and legOk and atEnd and bearPat and strongVol and not aboveAv and not extended

scoreB = 0
scoreS = 0
if pullBuy
    scoreB += 3
if pullSell
    scoreS += 3
if inGold and isLongFib
    scoreB += 2
if inGold and isShortFib
    scoreS += 2
if aboveAv and isLongFib
    scoreB += 1
if not aboveAv and isShortFib
    scoreS += 1
if bullPat
    scoreB += 1
if bearPat
    scoreS += 1
if aboveTL and isLongFib
    scoreB += 1
if not aboveTL and isShortFib and not na(tlNow)
    scoreS += 1
if nearPoc and isLongFib
    scoreB += 1
if nearPoc and isShortFib
    scoreS += 1
if contBuy
    scoreB += 2
if contSell
    scoreS += 2

raw = &quot;انتظار&quot;
if (pullBuy or contBuy) and scoreB &gt;= 4 and scoreB &gt; scoreS
    raw := &quot;شراء&quot;
else if (pullSell or contSell) and scoreS &gt;= 4 and scoreS &gt; scoreB
    raw := &quot;بيع&quot;

peakLive = legOk and ((isLongFib and hiOff &gt;= -2) or (isShortFib and loOff &gt;= -2))
peakHold = atEnd and not peakLive

isFastTF = timeframe.in_seconds() &lt; 900
holdNeed = isFastTF ? 3 : 1
flipNeed = isFastTF ? 4 : 2
weakLong  = isFastTF ? lostStart : (lostStart or isShortFib)
weakShort = isFastTF ? lostStart : (lostStart or isLongFib)
mxLive = mxEntry &gt; 0 and mxCont &gt; 0
mxLiveLong = mxLive and mxSide == &quot;شراء&quot;
mxLiveShort = mxLive and mxSide == &quot;بيع&quot;
closedOk = barstate.isconfirmed
biasLong = isLongFib
ctrTrend = (raw == &quot;شراء&quot; and not biasLong) or (raw == &quot;بيع&quot; and biasLong)
blowCtr = (raw == &quot;شراء&quot; and scoreB &gt;= scoreS + 4 and aboveAv) or (raw == &quot;بيع&quot; and scoreS &gt;= scoreB + 4 and not aboveAv)
blockedCtr = false
if isFastTF and ctrTrend and not blowCtr
    raw := &quot;انتظار&quot;
    blockedCtr := true

var string rec = &quot;انتظار&quot;
var int hold = 0
var string lastSide = &quot;انتظار&quot;
var int waitBars = 0
var int sideBars = 0
oppBuy  = rec == &quot;بيع&quot;  and raw == &quot;شراء&quot; and scoreB &gt;= scoreS + flipNeed and closedOk and not isFastTF
oppSell = rec == &quot;شراء&quot; and raw == &quot;بيع&quot;  and scoreS &gt;= scoreB + flipNeed and closedOk and not isFastTF
sameAsLast = raw == lastSide
oppAsLast = (raw == &quot;شراء&quot; and lastSide == &quot;بيع&quot;) or (raw == &quot;بيع&quot; and lastSide == &quot;شراء&quot;)
htfOk = (raw == &quot;شراء&quot; and biasLong) or (raw == &quot;بيع&quot; and not biasLong)
waitGate = lastSide == &quot;انتظار&quot; or sameAsLast or (waitBars &gt;= (isFastTF ? 2 : 1) and closedOk and (htfOk or blowCtr))
blockedFlip = blockedCtr
if mxLiveLong and raw == &quot;بيع&quot;
    blockedFlip := true
    if weakLong
        rec := &quot;انتظار&quot;
        hold := 0
    else if rec != &quot;شراء&quot;
        rec := &quot;شراء&quot;
        hold := 0
else if mxLiveShort and raw == &quot;شراء&quot;
    blockedFlip := true
    if weakShort
        rec := &quot;انتظار&quot;
        hold := 0
    else if rec != &quot;بيع&quot;
        rec := &quot;بيع&quot;
        hold := 0
else if raw == &quot;شراء&quot; or raw == &quot;بيع&quot;
    if rec == raw
        rec := raw
        hold := 0
    else if rec == &quot;انتظار&quot;
        if waitGate
            rec := raw
            hold := 0
        else
            blockedFlip := true
    else if oppBuy or oppSell
        rec := raw
        hold := 0
    else
        blockedFlip := true
else
    exiting = (rec == &quot;شراء&quot; and weakLong) or (rec == &quot;بيع&quot; and weakShort)
    if exiting
        rec := &quot;انتظار&quot;
        hold := 0
    else
        hold += 1
        if hold &gt;= holdNeed
            rec := &quot;انتظار&quot;

if rec == &quot;شراء&quot; or rec == &quot;بيع&quot;
    lastSide := rec
    sideBars += 1
    waitBars := 0
else
    waitBars += 1
    sideBars := 0

hasTrade = rec == &quot;شراء&quot; or rec == &quot;بيع&quot;
newBuy  = rec == &quot;شراء&quot; and rec[1] != &quot;شراء&quot;
newSell = rec == &quot;بيع&quot;  and rec[1] != &quot;بيع&quot;
recCol = rec == &quot;شراء&quot; ? color.lime : rec == &quot;بيع&quot; ? color.red : color.gray

entryP = lv618
slP    = isLongFib ? lv000 - atr * 0.2 : lv000 + atr * 0.2
tpP    = lv127

advice = &quot;—&quot;
adviceCol = color.gray
if rec == &quot;شراء&quot;
    advice := inGold ? &quot;أفضل دخول | هدف امتداد 1&quot; : inShallow ? &quot;تصحيح بسيط | دخول&quot; : peakLive ? &quot;القمة تتحرك | امتداد&quot; : &quot;زخم مع الموجة&quot;
    adviceCol := color.lime
else if rec == &quot;بيع&quot;
    advice := inGold ? &quot;أفضل دخول | هدف امتداد 1&quot; : inShallow ? &quot;تصحيح بسيط | دخول&quot; : peakLive ? &quot;القاع يتحرك | امتداد&quot; : &quot;زخم مع الموجة&quot;
    adviceCol := color.red
else if lostStart
    advice := &quot;كسر الوقف | انتظر موجة جديدة&quot;
    adviceCol := color.red
else if peakLive and isLongFib
    advice := bullPat and strongVol ? &quot;قمة تتحرك | امتداد نحو جني الربح&quot; : &quot;قمة حتى الآن | تراجع أو امتداد&quot;
    adviceCol := bullPat and strongVol ? color.lime : color.orange
else if peakLive and isShortFib
    advice := bearPat and strongVol ? &quot;قاع يتحرك | امتداد نحو جني الربح&quot; : &quot;قاع حتى الآن | ارتداد أو امتداد&quot;
    adviceCol := bearPat and strongVol ? color.red : color.orange
else if atEnd
    advice := isLongFib ? &quot;قمة مستقرة | انتظر أفضل دخول&quot; : &quot;قاع مستقر | انتظر أفضل دخول&quot;
    adviceCol := color.orange
else if inGold
    advice := &quot;في أفضل دخول | بانتظار تأكيد&quot;
    adviceCol := color.yellow
else if legOk
    advice := isLongFib ? &quot;موجة صاعدة | انتظر أفضل دخول&quot; : &quot;موجة هابطة | انتظر أفضل دخول&quot;
    adviceCol := color.gray

mxPosLong = mxEntry &gt; 0 and mxCont &gt; 0 and mxSide == &quot;شراء&quot;
mxPosShort = mxEntry &gt; 0 and mxCont &gt; 0 and mxSide == &quot;بيع&quot;
if blockedFlip and rec != &quot;انتظار&quot;
    advice := mxLive ? (mxLiveLong ? &quot;لا تعكس صفقة الشراء | 5د ضوضاء&quot; : &quot;لا تعكس صفقة البيع | 5د ضوضاء&quot;) : (isLongFib ? &quot;5د ضوضاء بيع | الموجة صاعدة — لا تعكس&quot; : &quot;5د ضوضاء شراء | الموجة هابطة — لا تعكس&quot;)
    adviceCol := color.orange
else if blockedFlip and rec == &quot;انتظار&quot;
    advice := mxLive ? &quot;اخرج فقط | ممنوع فتح العكس&quot; : &quot;انتظار التأكيد | ممنوع العكس السريع على 5د&quot;
    adviceCol := color.orange
else if mxPosLong and rec == &quot;بيع&quot;
    advice := pinHi ? &quot;لونج ضد الموجة | نجم رفض — لا تضيف، جني الارتداد&quot; : pinLo or sweepLo ? &quot;مطرقة تدعم لونجك | جني عند الرفض — لا زيادة&quot; : &quot;لونج ضد الموجة | الارتداد للخروج&quot;
    adviceCol := color.orange
else if mxPosShort and rec == &quot;شراء&quot;
    advice := pinLo ? &quot;شورت ضد الموجة | مطرقة رفض — لا تضيف، جني التصحيح&quot; : pinHi or sweepHi ? &quot;نجم يدعم شورك | جني عند الرفض — لا زيادة&quot; : &quot;شورت ضد الموجة | التصحيح للخروج&quot;
    adviceCol := color.orange
else if rec == &quot;انتظار&quot;
    if sweepLo
        advice := &quot;مطرقة صيد قاع | انتظر تأكيد فوق الذيل ثم تدفق&quot;
        adviceCol := color.orange
    else if sweepHi
        advice := &quot;نجم صيد قمة | انتظر تأكيد تحت الذيل ثم تدفق&quot;
        adviceCol := color.orange
    else if pinLo and isShortFib
        advice := &quot;مطرقة ضد الهبوط | ارتداد قصير — مو عكس الموجة&quot;
        adviceCol := color.orange
    else if pinHi and isLongFib
        advice := &quot;نجم ضد الصعود | تصحيح قصير — مو عكس الموجة&quot;
        adviceCol := color.orange

fibText = not legOk ? &quot;لا موجة كافية&quot; : isLongFib ? (peakLive ? &quot;لونج | القمة تتحرك&quot; : &quot;لونج | قمة حتى الآن&quot;) : (peakLive ? &quot;شورت | القاع يتحرك&quot; : &quot;شورت | قاع حتى الآن&quot;)
fibCol  = not legOk ? color.gray : isLongFib ? color.lime : color.red
goldText = inGold ? &quot;الآن في أفضل دخول&quot; : inShallow ? &quot;تصحيح بسيط&quot; : peakLive ? (isLongFib ? &quot;القمة تتحرك الآن&quot; : &quot;القاع يتحرك الآن&quot;) : atEnd ? &quot;عند القمة/القاع حتى الآن&quot; : close &lt; lv236 and isLongFib ? &quot;قرب الوقف&quot; : close &gt; lv236 and isShortFib ? &quot;قرب الوقف&quot; : &quot;خارج منطقة الدخول&quot;
goldCol  = inGold ? color.lime : inShallow ? color.yellow : peakLive ? color.orange : color.gray
avText = na(avwap) ? &quot;—&quot; : aboveAv ? &quot;فوق | تدفق شراء&quot; : &quot;تحت | تدفق بيع&quot;
avCol  = na(avwap) ? color.gray : aboveAv ? color.lime : color.red
tlText = tlUp ? &quot;قاعين صاعدين | دعم&quot; : tlDn ? &quot;قمتين هابطتين | مقاومة&quot; : &quot;لا خط واضح&quot;
tlCol  = tlUp ? color.lime : tlDn ? color.red : color.gray
pocText = na(poc) ? &quot;—&quot; : nearPoc ? &quot;عند POC&quot; : close &gt; poc ? &quot;فوق POC&quot; : &quot;تحت POC&quot;
pocCol  = na(poc) ? color.gray : nearPoc ? color.yellow : close &gt; poc ? color.lime : color.red
posText = hasTrade ? (rec == &quot;شراء&quot; ? &quot;لونج نشط&quot; : &quot;شورت نشط&quot;) : &quot;لا صفقة&quot;
posCol  = hasTrade ? recCol : color.gray

mxQtyUse = mxCont * mxContSz
mxOpen = mxEntry &gt; 0 and mxCont &gt; 0 and mxMargin &gt; 0 and mxLev &gt;= 1
mxLong = mxSide == &quot;شراء&quot;
mxMark = math.round(close * 100.0) / 100.0
mxPnl = mxOpen ? (mxLong ? (mxMark - mxEntry) : (mxEntry - mxMark)) * mxQtyUse : 0.0
mxMmr = mxMMR / 100.0
mxNotional = mxQtyUse * mxEntry
mxQtyBad = mxOpen and mxNotional &gt; 0 and mxMargin &gt; mxNotional
mxIMR = mxOpen and mxNotional &gt; 0 ? math.min(mxMargin / mxNotional, 0.90) : 1.0 / mxLev
mxLiq = mxOpen and not mxQtyBad ? (mxLong ? mxEntry * (1.0 - mxIMR + mxMmr) : mxEntry * (1.0 + mxIMR - mxMmr)) : na
mxSideTxt = mxOpen ? ((mxLong ? &quot;لونج &quot; : &quot;شورت &quot;) + str.tostring(mxLev, &quot;#&quot;) + &quot;x · &quot; + str.tostring(mxCont) + &quot; Cont&quot;) : &quot;لا صفقة&quot;
mxPnlTxt = (mxPnl &gt;= 0 ? &quot;+&quot; : &quot;&quot;) + str.tostring(mxPnl, &quot;#.##&quot;)
mxLiqTxt = mxOpen and not na(mxLiq) ? str.tostring(mxLiq, &quot;#.##&quot;) : &quot;—&quot;
mxInitMar = mxOpen ? mxNotional / mxLev : 0.0
mxRoi = mxInitMar &gt; 0 ? mxPnl / mxInitMar * 100.0 : 0.0
mxPnlCol = not mxOpen ? color.gray : mxQtyBad ? color.orange : mxPnl &gt; 0 ? color.lime : mxPnl &lt; 0 ? color.red : color.gray
mxSideCol = not mxOpen ? color.gray : mxQtyBad ? color.orange : mxLong ? color.lime : color.red
mxPnlLiqTxt = not mxOpen ? &quot;—&quot; : mxQtyBad ? &quot;الكمية Cont غلط — اكتب Size(Cont) بدون فاصلة مثل 5753&quot; : mxPnlTxt + &quot; @&quot; + str.tostring(mxMark, &quot;#.##&quot;) + &quot; | تصفية &quot; + mxLiqTxt
newsNearTxt = nearestCD + &quot; | &quot; + newsStatus
newsDirRngTxt = newsDirTxt + &quot;  &quot; + pxTxt
newsMixTxt = newsPricedTxt + &quot; | &quot; + statTxt
tblSz = size.small

enterTxt = &quot;لا تدخل&quot;
enterCol = color.gray
if mxLive
    if (mxLiveLong and rec == &quot;بيع&quot;) or (mxLiveShort and rec == &quot;شراء&quot;) or (blockedFlip and rec == &quot;انتظار&quot;)
        enterTxt := &quot;اخرج فقط — لا تعكس&quot;
        enterCol := color.orange
    else
        enterTxt := &quot;صفقتك قائمة — لا تضيف&quot;
        enterCol := mxLiveLong ? color.lime : color.red
else if rec == &quot;شراء&quot;
    if blockedFlip
        enterTxt := &quot;لا تدخل — انتظر تأكيد&quot;
        enterCol := color.orange
    else if inGold or inShallow
        enterTxt := &quot;ادخل شراء الآن&quot;
        enterCol := color.lime
    else if peakLive or atEnd or extended
        enterTxt := &quot;شراء — لا تدخل هنا، انتظر الذهبية&quot;
        enterCol := color.yellow
    else
        enterTxt := &quot;شراء — ادخل في المنطقة الذهبية&quot;
        enterCol := color.yellow
else if rec == &quot;بيع&quot;
    if blockedFlip
        enterTxt := &quot;لا تدخل — انتظر تأكيد&quot;
        enterCol := color.orange
    else if inGold or inShallow
        enterTxt := &quot;ادخل بيع الآن&quot;
        enterCol := color.red
    else if peakLive or atEnd or extended
        enterTxt := &quot;بيع — لا تدخل هنا، انتظر الذهبية&quot;
        enterCol := color.yellow
    else
        enterTxt := &quot;بيع — ادخل في المنطقة الذهبية&quot;
        enterCol := color.yellow
else if blockedFlip
    enterTxt := &quot;لا تدخل — الموجة تمنع العكس&quot;
    enterCol := color.orange
recShow = rec + &quot; → &quot; + enterTxt

// ══════════════════════════════════════════════════════════════
// الرسم
// ══════════════════════════════════════════════════════════════
f_killLines(arr) =&gt;
    sz = array.size(arr)
    if sz &gt; 0
        for i = 0 to sz - 1
            line.delete(array.get(arr, i))
        array.clear(arr)

f_killLabs(arr) =&gt;
    sz = array.size(arr)
    if sz &gt; 0
        for i = 0 to sz - 1
            label.delete(array.get(arr, i))
        array.clear(arr)

f_killBox(arr) =&gt;
    sz = array.size(arr)
    if sz &gt; 0
        for i = 0 to sz - 1
            box.delete(array.get(arr, i))
        array.clear(arr)

f_fibLine(x1, y, col, w, sty, arr) =&gt;
    array.push(arr, line.new(x1, y, bar_index + 4, y, xloc=xloc.bar_index, extend=extend.right, color=col, width=w, style=sty))

f_fibLab(x, y, txt, col, arr) =&gt;
    array.push(arr, label.new(x, y, txt, xloc=xloc.bar_index, style=label.style_none, color=color.new(color.black, 100), textcolor=col, size=size.normal, textalign=text.align_left))

var array&lt;line&gt;  fibLn = array.new&lt;line&gt;()
var array&lt;label&gt; fibLb = array.new&lt;label&gt;()
var array&lt;box&gt;   fibBx = array.new&lt;box&gt;()
var array&lt;line&gt;  extra = array.new&lt;line&gt;()
var array&lt;label&gt; extraLb = array.new&lt;label&gt;()

if barstate.islast
    f_killLines(fibLn)
    f_killLabs(fibLb)
    f_killBox(fibBx)
    f_killLines(extra)
    f_killLabs(extraLb)

    if showFib and legOk
        x1 = math.max(0, b0)
        f_fibLine(x1, lv000, color.new(#787B86, 0), 2, line.style_solid, fibLn)
        f_fibLine(x1, lv236, color.new(#F23645, 20), 1, line.style_dashed, fibLn)
        f_fibLine(x1, lv382, color.new(#FF9800, 10), 1, line.style_dashed, fibLn)
        f_fibLine(x1, lv500, color.new(#787B86, 0), 1, line.style_solid, fibLn)
        f_fibLine(x1, lv618, color.new(#089981, 0), 2, line.style_solid, fibLn)
        f_fibLine(x1, lv786, color.new(#26C6DA, 10), 1, line.style_dashed, fibLn)
        f_fibLine(x1, lv100, color.new(#FFD54F, 0), 2, line.style_solid, fibLn)

        f_fibLab(bar_index, lv236, &quot;نزل زيادة لا تدخل&quot;, #FF5252, fibLb)
        f_fibLab(bar_index, lv618, &quot;أفضل دخول&quot;, #00E676, fibLb)
        f_fibLab(bar_index, lv100, isLongFib ? &quot;القمة حتى الآن&quot; : &quot;القاع حتى الآن&quot;, #FFD54F, fibLb)

        if hasTrade
            f_fibLine(x1, lv127, color.new(#2962FF, 0), 1, line.style_dotted, fibLn)
            f_fibLine(x1, lv162, color.new(#AB47BC, 0), 1, line.style_dotted, fibLn)
            f_fibLab(bar_index, lv127, &quot;امتداد 1&quot;, #448AFF, fibLb)
            f_fibLab(bar_index, lv162, &quot;امتداد 2&quot;, #E040FB, fibLb)

        if showGold
            hiG = math.max(lv500, lv618)
            loG = math.min(lv500, lv618)
            array.push(fibBx, box.new(x1, hiG, bar_index + 8, loG, xloc=xloc.bar_index, bgcolor=color.new(#00E676, 88), border_color=color.new(#00E676, 55), border_width=1))

        array.push(fibLn, line.new(x1, lv000, math.max(x1 + 1, b1), lv100, xloc=xloc.bar_index, color=color.new(isLongFib ? color.lime : color.red, 45), width=1, style=line.style_dotted))

    if showAvwap and not na(avwap) and legOk
        array.push(extra, line.new(math.max(0, b0), avwap, bar_index + 4, avwap, extend=extend.right, color=color.new(#AB47BC, 0), width=2))
        array.push(extraLb, label.new(bar_index, avwap, &quot;متوسط الحجم&quot;, style=label.style_none, color=color.new(color.black, 100), textcolor=#CE93D8, size=size.small))

    if showPoc and not na(poc) and legOk
        array.push(extra, line.new(math.max(0, b0), poc, bar_index + 4, poc, extend=extend.right, color=color.new(#FFD54F, 0), width=1, style=line.style_dashed))

    if showTL and tlUp
        array.push(extra, line.new(prevLB, prevL, lastLB, lastL, extend=extend.right, color=color.new(#26A69A, 0), width=2))
    if showTL and tlDn
        array.push(extra, line.new(prevHB, prevH, lastHB, lastH, extend=extend.right, color=color.new(#EF5350, 0), width=2))

    if showPos and hasTrade
        eCol = rec == &quot;شراء&quot; ? color.new(#00ACC1, 0) : color.new(#FF8A65, 0)
        array.push(extra, line.new(bar_index - 4, entryP, bar_index + 6, entryP, color=eCol, width=2))
        array.push(extra, line.new(bar_index - 4, slP, bar_index + 6, slP, color=color.new(#EF5350, 0), width=2, style=line.style_dashed))
        array.push(extra, line.new(bar_index - 4, tpP, bar_index + 6, tpP, color=color.new(#66BB6A, 0), width=2, style=line.style_dashed))
        hiB = math.max(entryP, tpP)
        loB = math.min(entryP, tpP)
        array.push(fibBx, box.new(bar_index - 4, hiB, bar_index + 6, loB, bgcolor=color.new(rec == &quot;شراء&quot; ? #26A69A : #EF5350, 90), border_color=color.new(color.white, 80), border_width=1))

bgcolor(isHighImpactBar ? color.new(color.orange, 90) : approachingBar ? color.new(color.yellow, 93) : na)

var table t = table.new(position.top_right, 2, 19, border_width=1)

if showTable and barstate.islast
    table.clear(t, 0, 0, 1, 18)
    table.cell(t, 0, 0, &quot;MEXC Structure v2.42&quot;, bgcolor=color.blue, text_color=color.white, text_size=tblSz)
    table.cell(t, 1, 0, &quot;SOL&quot;, bgcolor=color.blue, text_color=color.yellow, text_size=tblSz)
    table.cell(t, 0, 1, &quot;الدخول&quot;, bgcolor=color.new(enterCol, 20), text_size=tblSz)
    table.cell(t, 1, 1, recShow, bgcolor=color.new(enterCol, 20), text_color=color.white, text_size=tblSz)
    table.cell(t, 0, 2, &quot;نصيحة&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 2, advice, text_color=adviceCol, text_size=tblSz)
    table.cell(t, 0, 3, &quot;صفقة MEXC&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 3, mxSideTxt, text_color=mxSideCol, text_size=tblSz)
    table.cell(t, 0, 4, &quot;الربح&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 4, mxPnlLiqTxt, text_color=mxPnlCol, text_size=tblSz)
    table.cell(t, 0, 5, &quot;تدفق كبير&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 5, whaleTxt, text_color=whaleCol, text_size=tblSz)
    table.cell(t, 0, 6, &quot;فيبو / ذهبية&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 6, fibText + &quot; | &quot; + goldText, text_color=fibCol, text_size=tblSz)
    table.cell(t, 0, 7, &quot;VWAP / POC&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 7, avText + &quot; | &quot; + pocText, text_color=avCol, text_size=tblSz)
    table.cell(t, 0, 8, &quot;نمط / اتجاه&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 8, patText + &quot; | &quot; + tlText, text_color=patCol, text_size=tblSz)
    table.cell(t, 0, 9, &quot;منطقة&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 9, zoneTxt, text_color=zoneCol, text_size=tblSz)
    table.cell(t, 0, 10, &quot;شمعات&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 10, candleTxt, text_color=candleCol, text_size=tblSz)
    table.cell(t, 0, 11, &quot;ذيول&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 11, wickTxt, text_color=wickCol, text_size=tblSz)
    table.cell(t, 0, 12, &quot;الوقت&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 12, timeStr, text_size=tblSz)
    table.cell(t, 0, 13, &quot;الجلسة&quot;, bgcolor=color.gray, text_size=tblSz)
    table.cell(t, 1, 13, sessTxt, text_color=sessCol, text_size=tblSz)
    table.cell(t, 0, 14, &quot;أقرب خبر&quot;, bgcolor=color.new(#37474F, 0), text_color=color.white, text_size=tblSz)
    table.cell(t, 1, 14, newsNearTxt, bgcolor=color.new(#37474F, 0), text_color=newsCol, text_size=tblSz)
    if newsPanel
        table.cell(t, 0, 15, &quot;اتجاه الخبر&quot;, bgcolor=color.gray, text_size=tblSz)
        table.cell(t, 1, 15, newsDirRngTxt, text_color=newsDirCol, text_size=tblSz)
        table.cell(t, 0, 16, &quot;نتيجة الخبر&quot;, bgcolor=color.gray, text_size=tblSz)
        table.cell(t, 1, 16, newsResTxt, text_color=newsResCol, text_size=tblSz)
        table.cell(t, 0, 17, &quot;تسعير SOL&quot;, bgcolor=color.gray, text_size=tblSz)
        table.cell(t, 1, 17, newsMixTxt, text_color=statCol, text_size=tblSz)

alertcondition(newBuy,  &quot;شراء&quot;, &quot;شراء – MEXC Structure&quot;)
alertcondition(newSell, &quot;بيع&quot;,  &quot;بيع – MEXC Structure&quot;)
alertcondition(isHighImpact and not isHighImpact[1], &quot;خبر&quot;, &quot;نافذة أخبار&quot;)
alertcondition(approaching and not approaching[1], &quot;اقتراب&quot;, &quot;خبر خلال 12 د&quot;)
</textarea>
<script>
function copyMe(){
  const t=document.getElementById('c');
  t.focus();
  t.setSelectionRange(0, t.value.length);
  const btn=document.getElementById('btn');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t.value).then(()=>{
      btn.textContent='تم النسخ ✓';
      btn.className='ok';
    }).catch(()=>{
      btn.textContent='محدد — اضغط نسخ من القائمة';
    });
  } else {
    btn.textContent='محدد — اضغط نسخ من القائمة';
  }
}
</script>
